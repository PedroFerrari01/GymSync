# O GitHub avisa (e abre um pedido de atualização) quando sai versão nova com correção de segurança
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
