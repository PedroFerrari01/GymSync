# Perfil de produção (publicação na internet). Ativado com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
# Nenhuma senha fica neste arquivo: tudo vem de variáveis de ambiente do servidor.
# Variáveis obrigatórias: DB_URL, DB_USUARIO, DB_SENHA, ADMIN_SENHA, URL_BASE. Opcional: BREVO_CHAVE (e-mail).
# Sem alguma delas, o sistema não sobe (de propósito).

spring.application.name=sistema-academia
# A hospedagem informa a porta na variável PORT (o Render usa 10000)
server.port=${PORT:8080}

# Banco: use um usuário próprio do sistema, não o root
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# validate: o Hibernate só confere as tabelas, não altera nada.
# Na primeira publicação (ou quando surgir tabela/coluna nova), suba uma vez com DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Administrador (com senhas fortes ligadas, o sistema não sobe com senha de admin fraca)
gymsync.admin.usuario=${ADMIN_USUARIO:admin}
gymsync.admin.senha=${ADMIN_SENHA}
gymsync.senhas-fortes=true

# Acesso de visitante (só leitura, com dados de exemplo criados se o banco estiver vazio).
# Ligue com VISITANTE=true só num site de demonstração: o visitante enxerga o painel inteiro.
gymsync.visitante=${VISITANTE:false}

# Recuperação de senha por e-mail, com link de uso único
gymsync.recuperacao-por-email=true
# Endereço público do sistema, usado no link do e-mail (ex.: https://gymsync.com.br)
gymsync.url-base=${URL_BASE}

# E-mail pelo Brevo (pela web, porque o plano grátis do Render bloqueia as portas de e-mail do Gmail).
# BREVO_CHAVE: chave de API criada em app.brevo.com (SMTP & API > API Keys).
# O remetente precisa estar verificado no Brevo (Senders). Ele é também o endereço de resposta.
# Sem BREVO_CHAVE o site funciona, mas a recuperação de senha avisa para procurar a recepção.
gymsync.email.brevo-chave=${BREVO_CHAVE:}
gymsync.email.remetente=${EMAIL_REMETENTE:suportegymsync@gmail.com}

# Sessão: só por cookie, cookie protegido (Secure exige HTTPS), expira em 30 minutos parado
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Atrás do Nginx: usa o IP real do visitante e entende que a conexão é HTTPS
server.forward-headers-strategy=native

# Páginas de erro sem detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
