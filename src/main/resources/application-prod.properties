# Perfil de produção (publicação na internet). Ativado com a variável de ambiente SPRING_PROFILES_ACTIVE=prod.
# Nenhuma senha fica neste arquivo: tudo vem de variáveis de ambiente do servidor.
# Variáveis obrigatórias: DB_URL, DB_USUARIO, DB_SENHA, ADMIN_SENHA, EMAIL_SENHA, URL_BASE.
# Sem alguma delas, o sistema não sobe (de propósito).

spring.application.name=sistema-academia

# Banco: use um usuário próprio do sistema, não o root
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# validate: o Hibernate só confere as tabelas, não altera nada.
# Na primeira publicação (ou quando surgir tabela/coluna nova), suba uma vez com DDL_AUTO=update.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Administrador (com senhas fortes ligadas, o sistema não sobe com senha de admin fraca)
gymsync.admin.usuario=${ADMIN_USUARIO:admin}
gymsync.admin.senha=${ADMIN_SENHA}
gymsync.senhas-fortes=true

# Recuperação de senha por e-mail, com link de uso único
gymsync.recuperacao-por-email=true
# Endereço público do sistema, usado no link do e-mail (ex.: https://gymsync.com.br)
gymsync.url-base=${URL_BASE}

# E-mail de suporte (Gmail). EMAIL_SENHA é uma "senha de app" do Google, não a senha normal da conta.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USUARIO:suportegymsync@gmail.com}
spring.mail.password=${EMAIL_SENHA}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sessão: só por cookie, cookie protegido (Secure exige HTTPS), expira em 30 minutos parado
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Atrás do Nginx: usa o IP real do visitante e entende que a conexão é HTTPS
server.forward-headers-strategy=native

# Páginas de erro sem detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
