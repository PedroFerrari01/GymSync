<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>GymSync — Nova senha</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/gymsync.css}">
    <link rel="stylesheet" th:href="@{/css/gymsync-tema.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<main class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="login-card">
        <div class="login-logo"><img th:src="@{/img/logo-completo-fundo-escuro.png}" class="logo-fundo-escuro" alt="GymSync" height="120"><img th:src="@{/img/logo-completo-fundo-claro.png}" class="logo-fundo-claro" alt="GymSync" height="120"></div>

        <div th:if="${erro}" class="alert alert-danger py-2 small rounded-3 border-0 mb-3">
            <i class="bi bi-exclamation-circle-fill me-1"></i><span th:text="${erro}"></span>
        </div>

        <div th:unless="${tokenValido}">
            <div class="alert alert-warning py-2 small rounded-3 border-0 mb-3">
                <i class="bi bi-hourglass-bottom me-1"></i>Este link é inválido, já foi usado ou venceu. Peça um novo em "Esqueceu a senha".
            </div>
            <a th:href="@{/}" class="btn-brand w-100 d-block text-center text-decoration-none">Voltar para o login</a>
        </div>

        <form th:if="${tokenValido}" th:action="@{/redefinir-senha}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <h5 class="fw-bold mb-3"><i class="bi bi-key-fill me-2" style="color:var(--accent);"></i>Criar nova senha</h5>
            <label class="form-label">Nova senha (mínimo <span th:text="${tamanhoMinimoSenha}">8</span> caracteres)</label>
            <div class="pass-group mb-4">
                <input type="password" name="novaSenha" id="inputNovaSenhaLink" class="form-control pe-5" th:minlength="${tamanhoMinimoSenha}" required autofocus>
                <button type="button" class="pass-toggle" onclick="alternarSenha('inputNovaSenhaLink', this)"><i class="bi bi-eye"></i></button>
            </div>
            <button type="submit" class="btn-brand w-100">Salvar nova senha</button>
        </form>
    </div>
</main>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/gymsync.js}"></script>
</body>
</html>
