<div th:fragment="lista" th:if="${avisos != null and !#lists.isEmpty(avisos)}" class="mb-4 ocultar-impressao">
    <div th:each="av : ${avisos}" class="alert py-2 small rounded-3 border-0 mb-2" th:classappend="|alert-${av.tipo}|">
        <i class="bi bi-bell-fill me-2"></i><span th:text="${av.texto}"></span>
    </div>
</div>
