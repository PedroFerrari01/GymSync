<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>GymSync — Leitor da catraca</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/gymsync.css}">
    <link rel="stylesheet" th:href="@{/css/gymsync-tema.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>

<main class="leitor-pagina">
    <div class="panel-card leitor-card">
        <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
            <h1 class="h5 fw-bold mb-0"><i class="bi bi-qr-code-scan me-2"></i>Leitor da carteirinha</h1>
            <a th:href="@{/}" class="btn-theme text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Voltar ao painel</a>
        </div>

        <div th:if="${sucesso}" class="alert alert-success py-2 small rounded-3 border-0 mb-3" role="alert">
            <i class="bi bi-unlock-fill me-1"></i><span th:text="${sucesso}"></span>
        </div>
        <div th:if="${erro}" class="alert alert-danger py-2 small rounded-3 border-0 mb-3" role="alert">
            <i class="bi bi-lock-fill me-1"></i><span th:text="${erro}"></span>
        </div>

        <div class="leitor-video">
            <video id="leitorVideo" muted playsinline aria-label="Imagem da webcam"></video>
            <div class="leitor-mira" aria-hidden="true"></div>
        </div>
        <canvas id="leitorCanvas" hidden></canvas>

        <p id="leitorStatus" class="small texto-apoio mt-3 mb-2" aria-live="polite">Clique em "Ligar câmera" e mostre o QR da carteirinha.</p>

        <div class="d-flex flex-wrap gap-2">
            <button type="button" id="leitorLigar" class="btn-biometria"><i class="bi bi-camera-video me-2"></i>Ligar câmera</button>
            <button type="button" id="leitorDesligar" class="btn-theme" hidden><i class="bi bi-camera-video-off me-2"></i>Desligar</button>
        </div>

        <form id="leitorForm" th:action="@{/entradas/carteirinha}" method="post" class="mt-3">
            <input type="hidden" name="origem" value="leitor">
            <label class="form-label small" for="leitorCodigo">Ou digite o código</label>
            <div class="d-flex gap-2">
                <input id="leitorCodigo" name="codigo" class="form-control" required autocomplete="off" placeholder="GS2...">
                <button type="submit" class="btn-biometria text-nowrap">Validar</button>
            </div>
        </form>

        <p class="small texto-apoio mt-3 mb-0">
            Simulação: não há catraca real. A imagem da câmera fica só neste navegador; apenas o código lido do QR é enviado ao sistema.
        </p>
    </div>
</main>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/gymsync.js}"></script>
<script th:src="@{/vendor/jsqr/jsQR.js}"></script>
<script th:src="@{/js/leitor-qr.js}"></script>
</body>
</html>
